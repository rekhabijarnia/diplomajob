    <!-- Trailing slash normalization for GitHub Pages subdirectories -->
    <script>
      (function() {
        if (location.hostname.includes('github.io')) {
          var p = location.pathname;
          if (p.length > 1 && !p.endsWith('/') && !p.split('/').pop().includes('.')) {
            location.replace(p + '/' + location.search + location.hash);
          }
        }
      })();
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet" />

    <style>html,body{min-height:100vh;margin:0;padding:0;color:#f1f5f9!important;background-color:#080d1a!important}@keyframes diplomaSpin{to{transform:rotate(360deg)}}</style>
    <script type="module" crossorigin src="./assets/index-DcLpJVtg.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-CofgBUix.css">
  </head>
  <body class="bg-background text-on-surface antialiased" style="background-color: #080d1a; color: #f1f5f9;">
    <div id="root">
      <div class="diploma-initial-spinner" style="min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; background-color: #080d1a; color: #f1f5f9; font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif; text-align: center; padding: 24px;">
        <div style="width: 44px; height: 44px; border: 3.5px solid #1e293b; border-top-color: #3b82f6; border-radius: 50%; animation: diplomaSpin 0.9s linear infinite; margin-bottom: 20px;"></div>
        <h1 style="font-size: 22px; font-weight: 800; margin: 0 0 8px 0; color: #3b82f6; letter-spacing: -0.02em;">DiplomaJob</h1>
        <p style="font-size: 13px; color: #94a3b8; margin: 0; max-width: 320px; line-height: 1.5;">
          Polytechnic &amp; Diploma Career Portal
        </p>
      </div>
    </div>

    <script>
      function handleMainScriptError() {
        console.warn('[DiplomaJob] /src/main.tsx could not be loaded directly as a module.');
        // If hosted on GitHub Pages and served from root without build action, redirect to docs/
        if (window.location.hostname.includes('github.io')) {
          var base = window.location.pathname;
          if (!base.endsWith('/')) {
            base = base.substring(0, base.lastIndexOf('/') + 1);
          }
          if (!base.includes('/docs/')) {
            window.location.replace(base + 'docs/');
            return;
          }
        }

        // If opened locally via file:// or uncompiled static server
        var rootEl = document.getElementById('root');
        if (rootEl) {
          rootEl.innerHTML = '<div style="min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; background-color: #080d1a; color: #f1f5f9; font-family: system-ui, sans-serif; text-align: center; padding: 24px;">' +
            '<div style="max-width: 520px; width: 100%; background: #0f172a; border: 1px solid #1e293b; border-radius: 16px; padding: 32px; box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);">' +
              '<div style="font-size: 40px; margin-bottom: 12px;">🎓</div>' +
              '<h2 style="font-size: 20px; font-weight: 700; margin: 0 0 10px 0; color: #38bdf8;">DiplomaJob Career Portal</h2>' +
              '<p style="font-size: 13px; color: #94a3b8; line-height: 1.6; margin: 0 0 20px 0;">' +
                'This is a React + TypeScript application. Modern browsers require either the Vite development server (<code style="color: #38bdf8;">npm run dev</code>) or the compiled production build (<code style="color: #38bdf8;">dist/index.html</code>).' +
              '</p>' +
              '<div style="background: #020617; border: 1px solid #1e293b; border-radius: 10px; padding: 14px; text-align: left; margin-bottom: 20px; font-family: monospace; font-size: 12px; color: #a5f3fc; line-height: 1.6;">' +
                '<span style="color: #64748b;"># Option 1: Start local dev server</span><br/>' +
                'npm install<br/>' +
                '<span style="color: #38bdf8;">npm run dev</span><br/><br/>' +
                '<span style="color: #64748b;"># Option 2: Build for static hosting (GitHub Pages)</span><br/>' +
                '<span style="color: #38bdf8;">npm run build</span>' +
              '</div>' +
              '<a href="./dist/index.html" style="display: inline-block; padding: 10px 20px; background: #2563eb; color: #ffffff; text-decoration: none; border-radius: 8px; font-size: 13px; font-weight: 600;">' +
                'Open Compiled Build (dist/index.html) →' +
              '</a>' +
            '</div>' +
          '</div>';
        }
      }

      // Fallback check after 4 seconds if the React app hasn't mounted
      setTimeout(function() {
        var root = document.getElementById('root');
        if (root && root.querySelector('.diploma-initial-spinner')) {
          if (window.location.protocol === 'file:') {
            handleMainScriptError();
          }
        }
      }, 4000);
    </script>
  </body>
</html>
