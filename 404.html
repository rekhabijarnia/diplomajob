<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>DiplomaJob - Polytechnic & Diploma Career Portal</title>
    <script type="text/javascript">
      // SPA redirect for GitHub Pages
      var pathSegmentsToKeep = 1;
      var l = window.location;
      var repoPath = l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/');
      window.location.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') + repoPath + '/'
      );
    </script>
  </head>
  <body style="background-color: #0b0f19; color: #ffffff; font-family: sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0;">
    <div style="text-align: center;">
      <h2>Loading DiplomaJob...</h2>
      <p style="color: #94a3b8; font-size: 14px;">Redirecting to career portal...</p>
    </div>
  </body>
</html>
